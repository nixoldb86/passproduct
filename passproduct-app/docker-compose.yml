version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: secondwallet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: secondwallet
      POSTGRES_PASSWORD: secondwallet_secret_2024
      POSTGRES_DB: secondwallet
    ports:
      - "5434:5432"
    volumes:
      - secondwallet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondwallet -d secondwallet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  secondwallet_data:
